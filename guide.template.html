<!DOCTYPE html>
<html lang="{{lang}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>{{ui.index.title}}</title>
  <meta name="description" content="{{ui.index.description}}">
  <link rel="canonical" href="{{url}}">
{{alternates}}  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Route 66 Logbook">
  <meta property="og:locale" content="{{ui.og.locale}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:title" content="{{ui.index.ogTitle}}">
  <meta property="og:description" content="{{ui.index.ogDescription}}">
  <meta property="og:image" content="https://route66logbook.com/images/og-home.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ui.index.ogTitle}}">
  <meta name="twitter:description" content="{{ui.index.ogDescription}}">
  <meta name="twitter:image" content="https://route66logbook.com/images/og-home.jpg">
{{schema}}  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/guide.css">
  <link rel="stylesheet" href="/styles/guide-tiles.css">
</head>
<body class="guide-home">

  <!-- HEADER (matches site) -->
  <site-header></site-header>

  <main>

    <!-- INTRO -->
    <section class="intro shell wide reveal">
      <p class="eyebrow ec">{{ui.index.eyebrow}}</p>
      <h1 class="intro-title">{{ui.index.h1}}</h1>
      <p class="intro-lede">{{ui.index.lede}}</p>
    </section>

{{groups}}

    <!-- SOURCES -->
    <section class="sources shell wide reveal">
      <h2>{{ui.sources.title}}</h2>
      <p>{{ui.sources.intro}}</p>
      <ul>
{{sources}}
      </ul>
    </section>

  </main>

{{download}}

  <!-- FOOTER (matches site) -->
  <site-footer></site-footer>

  <script>
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('visible'), i * 80);
          observer.unobserve(e.target);
        }
      });
    }, { threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  </script>

  <script src="/header.js" defer></script>
  <script src="/footer.js" defer></script>
</body>
</html>
